on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and Publish to Cloudflare Pages
    steps:
        - uses: actions/checkout@v5
          name: Checkout Repository

        - uses: actions/setup-go@v6
          with:
            go-version: '1.25'

        - run: go get
          name: Install Dependencies
        
        - run: go run main.go generate
          name: Build Site